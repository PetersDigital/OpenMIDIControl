---
# @description: Automated check for dual-license headers in all source files
# @owner: @dencelkbabu
# @sla: Best-effort (no uptime guarantee)
# @cost-center: Validation
name: "Validate: License Headers"

on:
  push:
    branches: [dev]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!.github/notify-telegram-HTMLCSS-preview/**'
  pull_request:
    branches: [dev, 'release/**', 'hotfix/**']
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!.github/notify-telegram-HTMLCSS-preview/**'

concurrency:
  group: license-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Check License Headers
        run: python scripts/check_license_headers.py
